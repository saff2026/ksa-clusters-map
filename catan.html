<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>موزّع أرقام كاتان</title>
<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface2:#f6f8f7;
  --ink:#16211d; --dim:#5d6b66; --line:#d7ded9;
  --go:#0e7c55; --goInk:#ffffff; --gold:#b8860b;
  --warn-bg:#fdf3dc; --warn-ink:#6b4e05; --warn-line:#e2c470;
  --err-bg:#fcecea; --err-ink:#7d2018; --err-line:#e3a79f;
  --ok-bg:#e6f4ec; --ok-ink:#0d5236; --ok-line:#9ccdb5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1614; --surface:#18201d; --surface2:#131a18;
    --ink:#e8efeb; --dim:#9aaaa4; --line:#2b3532;
    --go:#17a16f; --goInk:#04150e; --gold:#e0b55a;
    --warn-bg:#2e2611; --warn-ink:#f2d894; --warn-line:#5c4c1c;
    --err-bg:#2f1815; --err-ink:#f5b9b1; --err-line:#5e2a24;
    --ok-bg:#0f2a1f; --ok-ink:#a8dcc2; --ok-line:#215741;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1614; --surface:#18201d; --surface2:#131a18;
  --ink:#e8efeb; --dim:#9aaaa4; --line:#2b3532;
  --go:#17a16f; --goInk:#04150e; --gold:#e0b55a;
  --warn-bg:#2e2611; --warn-ink:#f2d894; --warn-line:#5c4c1c;
  --err-bg:#2f1815; --err-ink:#f5b9b1; --err-line:#5e2a24;
  --ok-bg:#0f2a1f; --ok-ink:#a8dcc2; --ok-line:#215741;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Segoe UI','Noto Sans Arabic',Tahoma,Arial,sans-serif;
  font-size:16px; line-height:1.75; direction:rtl; text-align:right;
}
.page{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:22px 56px}
h1{margin:0 0 4px;font-size:27px;line-height:1.3;text-wrap:balance}
.sub{margin:0 0 22px;color:var(--dim);font-size:15px}
.actions{display:flex;flex-direction:column;gap:10px}
.act{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:16px 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:inherit;
  font-size:19px;font-weight:700;cursor:pointer;text-align:right;
  transition:transform .06s ease, box-shadow .15s ease;
}
.act:hover:not(:disabled){box-shadow:0 3px 14px #0000001a}
.act:active:not(:disabled){transform:translateY(1px)}
.act:disabled{opacity:.42;cursor:not-allowed}
.act .badge{
  flex:none;width:32px;height:32px;border-radius:50%;
  background:var(--surface2);border:1px solid var(--line);color:var(--dim);
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.act.on{background:var(--go);color:var(--goInk);border-color:transparent}
.act.on .badge{background:#ffffff2e;border-color:#ffffff45;color:inherit}
.act:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.mini{
  padding:9px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-family:inherit;
  font-size:14px;font-weight:600;cursor:pointer;
}
.mini:hover{background:var(--surface2)}
.mini:disabled{opacity:.42;cursor:not-allowed}
.minirow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note{
  margin-top:14px;padding:11px 14px;border-radius:11px;font-size:14.5px;
  background:var(--surface2);border:1px solid var(--line);color:var(--dim);
}
.note.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-ink)}
.note.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.note.err{background:var(--err-bg);border-color:var(--err-line);color:var(--err-ink)}
.note b{font-weight:800}
#stage{margin-top:16px}
.canvasBox{
  background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;padding:8px;overflow:auto;
}
#view{display:block;max-width:100%;height:auto;border-radius:9px;cursor:pointer}
.fixrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.chip{
  display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:10px;
  border:2px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
}
.chip i{width:15px;height:15px;border-radius:4px;display:inline-block;border:1px solid #0003}
.chip.on{border-color:var(--gold);background:var(--surface2)}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;font-size:13.5px}
.cnt{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;
  background:var(--surface2);border:1px solid var(--line);color:var(--dim)}
.cnt i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid #0003}
.cnt b{color:var(--ink)}
details{margin-top:20px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:12px 16px}
summary{cursor:pointer;font-weight:700;font-size:15.5px}
summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.field{display:block;margin:14px 0 5px;font-size:13.5px;color:var(--dim);font-weight:600}
select,input[type=text]{
  width:100%;padding:9px 11px;border-radius:9px;font-family:inherit;font-size:15px;
  border:1px solid var(--line);background:var(--surface2);color:var(--ink);
}
input[type=range]{width:100%;accent-color:var(--go)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px;
  font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 7px;text-align:center}
th{background:var(--surface2);font-weight:700}
td.nm{text-align:right;font-weight:600;white-space:nowrap}
.num{display:inline-block;min-width:25px;padding:1px 5px;border-radius:6px;margin:1px;
  background:var(--surface2);border:1px solid var(--line);font-weight:700}
.num.hot{color:#c0392b;border-color:#c0392b66}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:13px}
.spin{display:none;width:17px;height:17px;border:3px solid var(--line);
  border-top-color:var(--go);border-radius:50%;animation:sp .8s linear infinite}
.busy .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page" dir="rtl" lang="ar">

<h1>🎲 موزّع أرقام كاتان</h1>
<p class="sub">ثلاث خطوات فقط: ارفع الصورة، وزّع الأرقام، نزّل الصورة.</p>

<div class="actions">
  <button class="act on" id="b1"><span class="badge">١</span><span>📷 ارفع صورة الخريطة</span><span class="spin" id="spin"></span></button>
  <button class="act" id="b2" disabled><span class="badge">٢</span><span>🎯 وزّع الأرقام</span></button>
  <button class="act" id="b3" disabled><span class="badge">٣</span><span>⬇️ نزّل الصورة</span></button>
</div>
<input type="file" id="file" accept="image/*" hidden>

<div class="note" id="status">اختر صورة خريطة كاتان من جهازك للبدء.</div>

<div id="stage" hidden>
  <div class="canvasBox"><canvas id="view"></canvas></div>
  <div class="counts" id="counts"></div>
</div>

<details id="adv">
  <summary>⚙️ إعدادات متقدمة (لست مضطراً لفتحها)</summary>

  <label class="field" for="digits">شكل الأرقام</label>
  <select id="digits">
    <option value="latin">أرقام إنجليزية 6 8 (المعتاد في اللعبة)</option>
    <option value="arabic">أرقام عربية ٦ ٨</option>
  </select>

  <label class="field" for="tokenSize">حجم رمز الرقم: <b id="szV">١٠٠٪</b></label>
  <input type="range" id="tokenSize" min="60" max="180" value="100">

  <label class="field" for="dropMode">إذا كانت بلاطات تضاريس أقل من ٤، احذف</label>
  <select id="dropMode">
    <option value="weak">الحظ الأضعف (٣ أو ١١) — مُوصى به</option>
    <option value="strong">الحظ الأقوى (٦ أو ٨)</option>
  </select>

  <label class="field">إعادة التوزيع والعرض</label>
  <div class="minirow">
    <button class="mini" id="bShuffle" disabled>🎲 جرّب توزيعاً آخر</button>
    <button class="mini" id="bEye">👁️ إخفاء أسماء التضاريس</button>
  </div>

  <label class="field">تصحيح يدوي (نادراً ما تحتاجه)</label>
  <div class="note" id="fixhint">اضغط «✏️ تصحيح النوع» بالأسفل، ثم اضغط على البلاطة في الصورة واختر نوعها.</div>
  <div class="fixrow" id="chips"></div>
  <div class="minirow" id="applyRow" hidden>
    <button class="mini" id="bApply"></button>
  </div>
  <div class="minirow">
    <button class="mini" id="mFix">✏️ تصحيح النوع</button>
    <button class="mini" id="mAdd">➕ إضافة بلاطة</button>
    <button class="mini" id="mDel">🗑️ حذف بلاطة</button>
    <button class="mini" id="mMove">✋ تحريك بلاطة</button>
  </div>
  <div class="minirow">
    <button class="mini" id="bRedetect">🔄 إعادة الكشف</button>
    <button class="mini" id="bClear">✖️ مسح كل البلاطات</button>
    <button class="mini" id="bManual">⚙️ شبكة يدوية</button>
  </div>

  <div id="manual" hidden>
    <label class="field" for="mRows">عدد البلاطات في كل صف (من الأعلى للأسفل)</label>
    <input type="text" id="mRows" value="3,4,5,4,3">
    <label class="field" for="mSize">حجم البلاطة: <b id="mSizeV">١٠٠٪</b></label>
    <input type="range" id="mSize" min="40" max="200" value="100">
    <label class="field" for="mX">الإزاحة الأفقية: <b id="mXV">٠</b></label>
    <input type="range" id="mX" min="-40" max="40" value="0">
    <label class="field" for="mY">الإزاحة الرأسية: <b id="mYV">٠</b></label>
    <input type="range" id="mY" min="-40" max="40" value="0">
    <label class="field" for="mR">الدوران: <b id="mRV">٠°</b></label>
    <input type="range" id="mR" min="-45" max="45" value="0">
  </div>

  <label class="field">معلومات تقنية (صوّرها لي إن بقيت مشكلة)</label>
  <div class="note" id="diag" style="font-family:monospace;font-size:12.5px;direction:ltr;text-align:left">—</div>

  <div id="ruleWrap" hidden>
    <label class="field">جدول التحقق من القوانين</label>
    <div id="ruleMsg"></div>
    <table id="ruleTable"></table>
  </div>
</details>

<p class="foot">كل شيء يتم داخل متصفحك — صورك لا تُرفع لأي خادم.</p>

</div>

<script>
/* ==== CORE START ==== */
var CORE = (function () {
'use strict';

/* ---------- تعريف التضاريس وألوانها المرجعية ---------- */
var TERRAINS = [
  { id:'wood',  name:'شجر',   css:'#2f6b3a',
    refs:[[47,107,58],[31,81,48],[59,125,67],[36,92,46],[26,74,40],[45,95,55]] },
  { id:'brick', name:'طوب',   css:'#c05a35',
    refs:[[192,90,53],[168,70,42],[210,112,63],[142,59,34],[176,84,52],[198,106,72],
          [205,170,120],[196,158,110],[186,146,102],[214,178,130]] },
  { id:'wheat', name:'قمح',   css:'#e8c24a',
    refs:[[232,194,74],[242,210,100],[217,173,53],[245,221,138],[228,182,60],[222,186,86]] },
  { id:'stone', name:'حجر',   css:'#8b9196',
    refs:[[139,145,150],[160,166,171],[111,117,122],[181,186,189],[126,134,141],[148,150,148]] },
  { id:'sheep', name:'خرفان', css:'#8fc24a',
    refs:[[143,194,74],[168,212,95],[127,184,63],[181,217,138],[154,201,88],[137,190,104]] },
  { id:'desert',name:'صحراء', css:'#e2d1a2',
    refs:[[226,209,162],[216,197,142],[238,223,184],[203,183,131],[229,214,175],[222,205,158],
          [243,241,236],[250,249,245],[232,230,224],[238,236,228]] }
];
var TERRAIN_IDS = TERRAINS.map(function (t) { return t.id; });
function terrainById(id){ for(var i=0;i<TERRAINS.length;i++) if(TERRAINS[i].id===id) return TERRAINS[i]; return null; }

/* ---------- الحظوظ الأربعة ---------- */
var TIERS = [
  { idx:0, name:'الحظ ١', nums:[6,8] },
  { idx:1, name:'الحظ ٢', nums:[5,9] },
  { idx:2, name:'الحظ ٣', nums:[4,10] },
  { idx:3, name:'الحظ ٤', nums:[3,11] }
];
/* الأزواج التي لا يجوز أن تتشارك نفس الرقم داخل نفس الحظ */
var PAIRS = [ ['wood','brick'], ['wheat','stone'] ];

function pipsOf(n){ return 6 - Math.abs(7 - n); }

/* ---------- تحويلات الألوان ---------- */
function rgb2hsv(r, g, b) {
  r/=255; g/=255; b/=255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn, h = 0;
  if (d > 0) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return [h, mx ? d / mx : 0, mx];
}
function srgb2lin(c){ c/=255; return c <= 0.04045 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4); }
function rgb2lab(r, g, b) {
  var R = srgb2lin(r), G = srgb2lin(g), B = srgb2lin(b);
  var X = (R*0.4124 + G*0.3576 + B*0.1805) / 0.95047;
  var Y = (R*0.2126 + G*0.7152 + B*0.0722);
  var Z = (R*0.0193 + G*0.1192 + B*0.9505) / 1.08883;
  function f(t){ return t > 0.008856 ? Math.pow(t, 1/3) : (7.787*t + 16/116); }
  var fx=f(X), fy=f(Y), fz=f(Z);
  return [116*fy - 16, 500*(fx-fy), 200*(fy-fz)];
}
function dLab(a, b) {
  var d0=a[0]-b[0], d1=a[1]-b[1], d2=a[2]-b[2];
  return Math.sqrt(d0*d0 + d1*d1 + d2*d2);
}
/* أقرب مسافة لون إلى ألوان تضاريس مرجعية */
var _refLab = null;
function refLab() {
  if (!_refLab) {
    _refLab = TERRAINS.map(function (t) {
      return t.refs.map(function (c) { return rgb2lab(c[0], c[1], c[2]); });
    });
  }
  return _refLab;
}
function terrainDistance(lab, terrainIndex) {
  var list = refLab()[terrainIndex], best = 1e9;
  for (var i = 0; i < list.length; i++) {
    var d = dLab(lab, list[i]);
    if (d < best) best = d;
  }
  return best;
}

/* ---------- أدوات إحصائية ---------- */
function median(arr) {
  if (!arr.length) return 0;
  var a = arr.slice().sort(function (x, y) { return x - y; });
  var m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}
function makeRng(seed) {
  var s = (seed >>> 0) || 12345;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

/* ---------- كشف أقراص الأرقام القديمة (دوائر فاتحة) ---------- */
function buildTokenMask(img, vMin, sMax) {
  if (vMin === undefined) vMin = 0.62;
  if (sMax === undefined) sMax = 0.45;
  var W = img.width, H = img.height, d = img.data;
  var mask = new Uint8Array(W * H);
  for (var i = 0, p = 0; i < W * H; i++, p += 4) {
    if (d[p+3] < 24) continue;
    var hsv = rgb2hsv(d[p], d[p+1], d[p+2]);
    if (hsv[2] > vMin && hsv[1] < sMax) mask[i] = 1;
  }
  return mask;
}
/* عتبات متعددة: صور فاتحة، داكنة، أقراص ملوّنة قليلاً */
var MASK_PRESETS = [[0.62,0.45],[0.55,0.55],[0.70,0.34],[0.48,0.62],[0.78,0.28],[0.40,0.72],[0.30,0.72],[0.22,0.80]];
function connectedComponents(mask, W, H, minArea, maxArea) {
  var seen = new Uint8Array(W * H);
  var stack = new Int32Array(W * H);
  var out = [];
  for (var start = 0; start < W * H; start++) {
    if (!mask[start] || seen[start]) continue;
    var sp = 0; stack[sp++] = start; seen[start] = 1;
    var area = 0, sx = 0, sy = 0;
    var minx = W, maxx = -1, miny = H, maxy = -1;
    while (sp > 0) {
      var q = stack[--sp];
      var x = q % W, y = (q - x) / W;
      area++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (x > 0     && mask[q-1] && !seen[q-1]) { seen[q-1]=1; stack[sp++]=q-1; }
      if (x < W - 1 && mask[q+1] && !seen[q+1]) { seen[q+1]=1; stack[sp++]=q+1; }
      if (y > 0     && mask[q-W] && !seen[q-W]) { seen[q-W]=1; stack[sp++]=q-W; }
      if (y < H - 1 && mask[q+W] && !seen[q+W]) { seen[q+W]=1; stack[sp++]=q+W; }
    }
    if (area < minArea || area > maxArea) continue;
    var w = maxx - minx + 1, h = maxy - miny + 1;
    /* نأخذ الأكبر بين نصف القطر المحسوب من المساحة ومن الإطار الخارجي،
       لأن الأرقام الداكنة داخل القرص تُنقص المساحة وتُصغّر التقدير */
    var rArea = Math.sqrt(area / Math.PI), rBox = (w + h) / 4;
    out.push({
      x: (minx + maxx) / 2, y: (miny + maxy) / 2, area: area, w: w, h: h,
      fill: area / (w * h), ratio: w / h,
      r: Math.max(rArea, rBox * 0.96)
    });
  }
  return out;
}
function detectTokens(img, vMin, sMax) {
  var W = img.width, H = img.height;
  var mask = buildTokenMask(img, vMin, sMax);
  var comps = connectedComponents(mask, W, H, 24, Math.round(W * H * 0.05));
  var cand = comps.filter(function (c) {
    return c.ratio > 0.58 && c.ratio < 1.72 && c.fill > 0.5 && c.fill <= 1.0;
  });
  if (cand.length < 3) return { tokens: [], mask: mask };
  /* نبقي المجموعة الأكبر من الأقراص المتقاربة في الحجم */
  var bestSet = [], bestScore = -1;
  for (var i = 0; i < cand.length; i++) {
    var r = cand[i].r, set = [];
    for (var j = 0; j < cand.length; j++) {
      if (cand[j].r >= r * 0.72 && cand[j].r <= r * 1.38) set.push(cand[j]);
    }
    if (set.length > bestScore) { bestScore = set.length; bestSet = set; }
  }
  if (bestSet.length < 3) return { tokens: [], mask: mask };
  var rMed = median(bestSet.map(function (c) { return c.r; }));
  var tokens = bestSet.filter(function (c) {
    return c.r >= rMed * 0.65 && c.r <= rMed * 1.45;
  });
  return { tokens: tokens, mask: mask, tokenRadius: rMed };
}

/* ---------- ملاءمة الشبكة السداسية ---------- */
function solve3(M, v) {
  var A = [M[0].slice(), M[1].slice(), M[2].slice()], b = v.slice();
  for (var c = 0; c < 3; c++) {
    var piv = c;
    for (var r = c + 1; r < 3; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-12) return null;
    var tA = A[c]; A[c] = A[piv]; A[piv] = tA;
    var tb = b[c]; b[c] = b[piv]; b[piv] = tb;
    for (var r2 = 0; r2 < 3; r2++) {
      if (r2 === c) continue;
      var f = A[r2][c] / A[c][c];
      for (var k = c; k < 3; k++) A[r2][k] -= f * A[c][k];
      b[r2] -= f * b[c];
    }
  }
  return [b[0]/A[0][0], b[1]/A[1][1], b[2]/A[2][2]];
}
function fitLattice(pts) {
  var n = pts.length;
  if (n < 3) return null;
  /* المسافة بين مركزين متجاورين */
  var nn = [];
  for (var i = 0; i < n; i++) {
    var best = 1e18;
    for (var j = 0; j < n; j++) {
      if (i === j) continue;
      var dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      var dd = dx*dx + dy*dy;

  var sc = 0, ss = 0, cnt = 0;
  for (var a = 0; a < n; a++) for (var b = a + 1; b < n; b++) {
    var vx = pts[b].x - pts[a].x, vy = pts[b].y - pts[a].y;
    var L = Math.sqrt(vx*vx + vy*vy);
    if (L < d * 0.78 || L > d * 1.28) continue;
    var th = Math.atan2(vy, vx);
    sc += Math.cos(6 * th); ss += Math.sin(6 * th); cnt++;
  }
  if (cnt < 2) return null;
  var ang = Math.atan2(ss, sc) / 6;
  var V1 = { x: d * Math.cos(ang), y: d * Math.sin(ang) };
  var V2 = { x: d * Math.cos(ang + Math.PI/3), y: d * Math.sin(ang + Math.PI/3) };

      var ex = O.x + coords[q].a * V1.x + coords[q].b * V2.x - pts[q].x;
      var ey = O.y + coords[q].a * V1.y + coords[q].b * V2.y - pts[q].y;
      out.push(Math.hypot(ex, ey));
    }
    return out;
  }
  for (var pass = 0; pass < 7; pass++) {
    var det = V1.x * V2.y - V2.x * V1.y;
    if (Math.abs(det) < 1e-9) return null;
    coords = [];
    for (k = 0; k < n; k++) {
      var px = pts[k].x - O.x, py = pts[k].y - O.y;
      var aa = ( px * V2.y - V2.x * py) / det;
      var bb = (-px * V1.y + V1.x * py) / det;
      coords.push({ a: Math.round(aa), b: Math.round(bb), ea: aa, eb: bb });
    }
    /* استبعاد الدوائر الدخيلة (موانئ/زخارف) بعد استقرار الملاءمة */
    if (pass === 2 || pass === 4) {
      var dNow = (Math.hypot(V1.x, V1.y) + Math.hypot(V2.x, V2.y)) / 2;
      var rr = residualsNow(), ni = 0, tmpIn = [];
      for (k = 0; k < n; k++) { var good = rr[k] <= dNow * 0.34; tmpIn.push(good); if (good) ni++; }
      if (ni >= Math.max(4, n * 0.5)) inlier = tmpIn;
    }
    /* أقل المربعات على النقاط السليمة فقط: p = O + a*V1 + b*V2 */
    var cnt=0, Sa=0, Sb=0, Saa=0, Sbb=0, Sab=0, Sx=0, Sy=0, Sax=0, Say=0, Sbx=0, Sby=0;
    for (var m = 0; m < n; m++) {
      if (!inlier[m]) continue;
      var A2 = coords[m].a, B2 = coords[m].b;
      cnt++;
      Sa += A2; Sb += B2; Saa += A2*A2; Sbb += B2*B2; Sab += A2*B2;
      Sx += pts[m].x; Sy += pts[m].y;
      Sax += A2 * pts[m].x; Say += A2 * pts[m].y;
      Sbx += B2 * pts[m].x; Sby += B2 * pts[m].y;
    }
    if (cnt < 3) break;
    var M = [[cnt, Sa, Sb], [Sa, Saa, Sab], [Sb, Sab, Sbb]];
    var solX = solve3(M, [Sx, Sax, Sbx]);
    var solY = solve3(M, [Sy, Say, Sby]);
    if (!solX || !solY) break;
    O = { x: solX[0], y: solY[0] };
    V1 = { x: solX[1], y: solY[1] };
    V2 = { x: solX[2], y: solY[2] };
  }
  var L1 = Math.hypot(V1.x, V1.y), L2 = Math.hypot(V2.x, V2.y);
  if (!(L1 > 2) || !(L2 > 2)) return null;
  if (L1 / L2 > 1.25 || L2 / L1 > 1.25) return null;
  var cosang = (V1.x*V2.x + V1.y*V2.y) / (L1 * L2);
  var degs = Math.acos(Math.max(-1, Math.min(1, cosang))) * 180 / Math.PI;
  if (degs < 48 || degs > 72) return null;
  /* خطأ الملاءمة (على النقاط السليمة) */
  var res = residualsNow(), err = 0, cnt2 = 0;
  for (var z = 0; z < n; z++) if (inlier[z]) { err += res[z]; cnt2++; }
  err = cnt2 ? err / cnt2 : 1e9;
  var dd2 = (L1 + L2) / 2;
  if (err > dd2 * 0.22) return null;
  return { O:O, V1:V1, V2:V2, d:dd2, error:err, coords:coords,
           residuals:res, inlier:inlier };
}
function latticeToPoint(lat, a, b) {
  return { x: lat.O.x + a*lat.V1.x + b*lat.V2.x, y: lat.O.y + a*lat.V1.y + b*lat.V2.y };
}
function pointToLattice(lat, x, y) {
  var det = lat.V1.x * lat.V2.y - lat.V2.x * lat.V1.y;
  var px = x - lat.O.x, py = y - lat.O.y;
  return {
    a: ( px * lat.V2.y - lat.V2.x * py) / det,
    b: (-px * lat.V1.y + lat.V1.x * py) / det
  };

/* ---------- أخذ عينة لون من داخل البلاطة ---------- */
function sampleColor(img, cx, cy, rIn, rOut, skipMask, avoidLab) {
  var W = img.width, H = img.height, d = img.data;
  var x0 = Math.max(0, Math.floor(cx - rOut)), x1 = Math.min(W-1, Math.ceil(cx + rOut));
  var y0 = Math.max(0, Math.floor(cy - rOut)), y1 = Math.min(H-1, Math.ceil(cy + rOut));
  var rs = [], gs = [], bs = [], total = 0, kept = 0, skipped = 0;
  var step = Math.max(1, Math.floor(rOut / 34));
  for (var y = y0; y <= y1; y += step) {
    for (var x = x0; x <= x1; x += step) {
      var dx = x - cx, dy = y - cy, dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < rIn || dist > rOut) continue;
      total++;
      var idx = y * W + x;
      if (skipMask && skipMask[idx]) continue;
      var p = idx * 4;
      if (d[p+3] < 24) continue;
      if (avoidLab && dLab(rgb2lab(d[p], d[p+1], d[p+2]), avoidLab) < 15) { skipped++; continue; }
      rs.push(d[p]); gs.push(d[p+1]); bs.push(d[p+2]);
    }
  }
  /* إن استُبعد أغلب العيّنة فاللون المتجنَّب هو لون البلاطة نفسها (الصحراء مثلاً) */
  if (avoidLab && rs.length < (rs.length + skipped) * 0.30) {
    return sampleColor(img, cx, cy, rIn, rOut, skipMask, null);
  }
  if (rs.length < 8) return null;
  return { r: median(rs), g: median(gs), b: median(bs), n: rs.length, total: total };
}
/* ==== CORE PART 1 END ==== */

/* ---------- إكمال البلاطات الناقصة (الصحراء وما فات الكشف) ---------- */
var NEI = [[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]];
function cellKey(a, b) { return a + ',' + b; }

function sampleBackground(img) {
  var W = img.width, H = img.height, out = [];
  var pts = [[0.03,0.03],[0.97,0.03],[0.03,0.97],[0.97,0.97],[0.5,0.015],[0.5,0.985]];
  var rad = Math.max(4, Math.round(Math.min(W, H) * 0.02));
  for (var i = 0; i < pts.length; i++) {
    var cx = pts[i][0] * W, cy = pts[i][1] * H;
    var c = sampleColor(img, cx, cy, 0, rad, null);
    if (!c) continue;
    var lab = rgb2lab(c.r, c.g, c.b);
    var near = 1e9;
    for (var t = 0; t < TERRAINS.length; t++) near = Math.min(near, terrainDistance(lab, t));
    if (near > 20) out.push(lab);   /* لون خلفية حقيقي (بحر/ورق/إطار) */
  }
  return out;
}

function completeBoard(img, lat, tiles) {
  var W = img.width, H = img.height;
  var occ = {}, i;
  for (i = 0; i < tiles.length; i++) occ[cellKey(tiles[i].a, tiles[i].b)] = 1;
  var minA = 1e9, maxA = -1e9, minB = 1e9, maxB = -1e9;
  for (i = 0; i < tiles.length; i++) {
    minA = Math.min(minA, tiles[i].a); maxA = Math.max(maxA, tiles[i].a);
    minB = Math.min(minB, tiles[i].b); maxB = Math.max(maxB, tiles[i].b);
  }
  var bg = sampleBackground(img);
  var rIn = lat.d * 0.10, rOut = lat.d * 0.40;
  var added = [];
  for (var a = minA - 1; a <= maxA + 1; a++) {
    for (var b = minB - 1; b <= maxB + 1; b++) {
      if (occ[cellKey(a, b)]) continue;
      var p = latticeToPoint(lat, a, b);
      var m = lat.d * 0.34;
      if (p.x < m || p.y < m || p.x > W - m || p.y > H - m) continue;
      var nb = 0;
      for (var k = 0; k < 6; k++) if (occ[cellKey(a + NEI[k][0], b + NEI[k][1])]) nb++;
      if (nb < 3) continue;
      var c = sampleColor(img, p.x, p.y, rIn, rOut, null);
      if (!c) continue;
      var lab = rgb2lab(c.r, c.g, c.b);
      var bestD = 1e9;
      for (var t = 0; t < TERRAINS.length; t++) bestD = Math.min(bestD, terrainDistance(lab, t));
      if (bestD > 34) continue;
      var isBg = false;
      for (var z = 0; z < bg.length; z++) if (dLab(lab, bg[z]) < 11) isBg = true;
      if (isBg) continue;
      added.push({ a:a, b:b, x:p.x, y:p.y, hasToken:false, tokenR:null });
    }
  }
  return added;
}

/* ---------- تصنيف التضاريس ---------- */
function clusterLabs(labs, thr, maxK) {
  if (!maxK) maxK = 1;
  var cl = labs.map(function (l, i) { return { items:[i], mean:l.slice() }; });
  while (cl.length > 1) {
    var bi = -1, bj = -1, bd = 1e9;
    for (var i = 0; i < cl.length; i++) for (var j = i + 1; j < cl.length; j++) {
      var d = dLab(cl[i].mean, cl[j].mean);
      if (d < bd) { bd = d; bi = i; bj = j; }
    }
    if (bd > thr && cl.length <= maxK) break;
    var A = cl[bi], B = cl[bj];
    var na = A.items.length, nb = B.items.length;
    A.mean = [ (A.mean[0]*na + B.mean[0]*nb)/(na+nb),
               (A.mean[1]*na + B.mean[1]*nb)/(na+nb),
               (A.mean[2]*na + B.mean[2]*nb)/(na+nb) ];
    A.items = A.items.concat(B.items);
    cl.splice(bj, 1);
  }
  return cl;
}
function hueDist(a, b) { var d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; }
function signedHue(h) { return h > 300 ? h - 360 : h; }

/* تكلفة مطلقة: هل صفات هذا اللون تناسب هذه التضاريس؟ */
function absCost(f, tIdx) {
  var id = TERRAINS[tIdx].id, c = 0;
  /* السطوع يُقاس نسبةً إلى أفتح تضاريس في نفس الصورة، فتعمل القاعدة في الصور المعتمة والساطعة */
  if (id === 'wheat')       c = hueDist(f.H, 48) / 5 + Math.max(0, 0.40 - f.S) * 45 + Math.max(0, 0.70 - f.Vn) * 35;
  else if (id === 'brick')  c = hueDist(f.H, 16) / 5 + Math.max(0, 0.30 - f.S) * 45;
  else if (id === 'wood')   c = hueDist(f.H, 118) / 7 + Math.max(0, f.Vn - 0.65) * 40 + Math.max(0, 0.14 - f.S) * 30;
  else if (id === 'sheep')  c = hueDist(f.H, 95) / 7 + Math.max(0, 0.60 - f.Vn) * 35 + Math.max(0, 0.14 - f.S) * 30;
  else if (id === 'stone')  c = Math.max(0, f.S - 0.22) * 95 + Math.abs(f.Vn - 0.68) * 14;
  else if (id === 'desert') c = hueDist(f.H, 42) / 5 * Math.min(1, f.S / 0.22) +
                                 Math.max(0, f.S - 0.42) * 55 + Math.max(0, 0.75 - f.Vn) * 35;
  return c + terrainDistance(f.labN, tIdx) * 0.35;
}
/* مقارنات نسبية: تحسم التشابه بين الأخضرين وبين القمح والصحراء مهما اختلف أسلوب الرسم */
function relCost(feats, asg) {
  var by = {}, i;
  for (i = 0; i < asg.length; i++) by[TERRAINS[asg[i]].id] = feats[i];
  var c = 0;
  if (by.wood && by.sheep && by.wood.Vn >= by.sheep.Vn - 0.02) c += 30;
  if (by.desert && by.wheat && by.desert.S >= by.wheat.S) c += 26;
  if (by.desert && by.wheat && by.desert.Vn <= by.wheat.Vn - 0.12) c += 14;
  if (by.brick && by.wheat && signedHue(by.brick.H) >= signedHue(by.wheat.H)) c += 20;
  if (by.stone) {
    var others = ['wood', 'brick', 'wheat', 'sheep'];
    for (i = 0; i < others.length; i++) {
      if (by[others[i]] && by.stone.S > by[others[i]].S) c += 16;
    }
  }
  if (by.desert) {
    /* الصحراء في كاتان هي البلاطة التي بلا رقم — وجود رقم قديم ينفيها قطعاً */
    if (by.desert.noTok < 0.5) c += 400;
    else c -= by.desert.noTok * 40;

/* أفضل إسناد بحيث لا تتكرر التضاريس، مع حساب التكاليف المطلقة والنسبية معاً */
function chooseLabels(feats, allowDesert) {
  var k = feats.length, best = null, bestC = 1e18;
  var used = new Array(TERRAINS.length).fill(false);
  var cur = new Array(k).fill(-1);
  if (allowDesert === false) {
    for (var z = 0; z < TERRAINS.length; z++) if (TERRAINS[z].id === 'desert') used[z] = true;
  }
  (function rec(i, acc) {
    if (acc >= bestC) return;
    if (i === k) {
      var total = acc + relCost(feats, cur);
      if (total < bestC) { bestC = total; best = cur.slice(); }
      return;
    }
    for (var t = 0; t < TERRAINS.length; t++) {
      if (used[t]) continue;
      used[t] = true; cur[i] = t;
      rec(i + 1, acc + absCost(feats[i], t) * feats[i].size);
      used[t] = false; cur[i] = -1;
    }

}
/* لون الحد الفاصل بين البلاطات: نقيسه من منتصفات المسافات بين المراكز المتجاورة */
function borderColorOf(img, tiles, d) {
  var rs = [], gs = [], bs = [], i, j;

    var dx = tiles[i].x - tiles[j].x, dy = tiles[i].y - tiles[j].y;
    if (Math.hypot(dx, dy) > d * 1.25) continue;
    var c = ringColor(img, (tiles[i].x + tiles[j].x) / 2, (tiles[i].y + tiles[j].y) / 2,

    if (c) { rs.push(c.r); gs.push(c.g); bs.push(c.b); }
  }

    if (!c) { labs.push(null); rgbs.push(null); continue; }
    tiles[i].rgb = [Math.round(c.r), Math.round(c.g), Math.round(c.b)];
    labs.push(rgb2lab(c.r, c.g, c.b));

  for (i = 0; i < tiles.length; i++) if (!tiles[i].hasToken) anyNoToken = true;
  if (noDesert) anyNoToken = false;

  var cl = clusterLabs(L, 17, maxK);

  /* بلاطة وحيدة شاذّة اللون وتحمل رقماً قديماً لا يمكن أن تكون تضاريس مستقلة:

      lone = i; break;

               (A.mean[1]*na + B.mean[1]*nb) / (na+nb),
               (A.mean[2]*na + B.mean[2]*nb) / (na+nb) ];
    A.items = A.items.concat(B.items);

    }
    if (terrainDistance(feats[i].labN, chosen) > 32 && bestV < 20) chosen = bestT;
    for (var q2 = 0; q2 < cl[i].items.length; q2++) {

    }
  }

  for (i = 0; i < tiles.length; i++) {
    if (!tiles[i].terrain) tiles[i].terrain = fallback;
    if (noDesert && tiles[i].terrain === 'desert') tiles[i].terrain = 'brick';
  }
}

/* هل يحمل مركز هذه البلاطة قرص رقم قديم؟

function hasNumberAt(img, cx, cy, d, tokenR) {
  var W = img.width, H = img.height, dat = img.data;

  for (var y = Math.round(cy - r); y <= cy + r; y += step) {
    for (var x = Math.round(cx - r); x <= cx + r; x += step) {
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      if (Math.hypot(x - cx, y - cy) > r) continue;
      var p = (y * W + x) * 4;
      if (dat[p+3] < 24) continue;
      tot++;
      var mx = Math.max(dat[p], dat[p+1], dat[p+2]) / 255;
      var mn = Math.min(dat[p], dat[p+1], dat[p+2]) / 255;
      var sat = mx ? (mx - mn) / mx : 0;
      if (mx > 0.70 && sat < 0.42) bright++;
      else if (mx < 0.60 || sat > 0.50) ink++;

/* ---------- التحليل الكامل للصورة ---------- */
function analyzeImage(img, vMin, sMax, noDesert) {
  var det = detectTokens(img, vMin, sMax);

  }
  var lat = fitLattice(det.tokens);
  if (!lat) return { ok:false, reason:'lattice', tiles:[], tokenCount:det.tokens.length };

  var tiles = [], seen = {}, i;
  for (i = 0; i < det.tokens.length; i++) {
    if (lat.inlier && !lat.inlier[i]) continue;          /* دائرة دخيلة خارج الشبكة */
    if (lat.residuals && lat.residuals[i] > lat.d * 0.40) continue;
    var a = lat.coords[i].a, b = lat.coords[i].b, key = cellKey(a, b);
    if (seen[key] !== undefined) {
      if (det.tokens[i].area > tiles[seen[key]].area) {
        tiles[seen[key]].x = det.tokens[i].x; tiles[seen[key]].y = det.tokens[i].y;
        tiles[seen[key]].tokenR = det.tokens[i].r; tiles[seen[key]].area = det.tokens[i].area;
      }
      continue;
    }
    seen[key] = tiles.length;
    tiles.push({ a:a, b:b, x:det.tokens[i].x, y:det.tokens[i].y,
                 hasToken:true, tokenR:det.tokens[i].r, area:det.tokens[i].area });
  }
  /* إسقاط البلاطات المعزولة تماماً (رموز خارج اللوحة) */
  if (tiles.length >= 7) {
    var occ0 = {};
    for (i = 0; i < tiles.length; i++) occ0[cellKey(tiles[i].a, tiles[i].b)] = 1;
    tiles = tiles.filter(function (t) {
      var c = 0;
      for (var q = 0; q < 6; q++) if (occ0[cellKey(t.a + NEI[q][0], t.b + NEI[q][1])]) c++;
      return c >= 2;
    });
  }
  var added = completeBoard(img, lat, tiles);
  for (i = 0; i < added.length; i++) tiles.push(added[i]);
  /* تثبيت المراكز على الشبكة لتكون المسافات منتظمة */
  for (i = 0; i < tiles.length; i++) {
    var p = latticeToPoint(lat, tiles[i].a, tiles[i].b);
    tiles[i].gx = p.x; tiles[i].gy = p.y;
  }
  /* إن كان نصف القطر المكتشف بحجم البلاطة نفسها، فنحن التقطنا البلاطات لا أقراص الأرقام.
     المواضع تبقى صحيحة، لكن لا يجوز اعتبار أي بلاطة «تحمل رقماً قديماً». */
  var tokenLike = (det.tokenRadius || 0) / lat.d;
  var hexMode = tokenLike > 0.38;

  if (hexMode) {
    for (i = 0; i < tiles.length; i++) { tiles[i].hasToken = false; tiles[i].tokenR = null; }
  }
  classifyTiles(img, tiles, lat.d, det.mask, tokR, noDesert);
  tiles.sort(function (p, q) { return (p.y - q.y) || (p.x - q.x); });
  if (tiles.length < 4) return { ok:false, reason:'fewtiles', tiles:tiles };
  return { ok:true, tiles:tiles, lattice:lat, d:lat.d, mask:det.mask, hexMode:hexMode,
           tokenRadius:tokR, tokenCount:det.tokens.length, added:added.length };
}

/* ============================================================

  [4,5,6,5,4],          /* ٢٤ */

/* عيّنة سريعة: نقاط قليلة على دائرة بدل مسح قرص كامل */

    var x = Math.round(cx + r * Math.cos(a)), y = Math.round(cy + r * Math.sin(a));
    if (x < 0 || y < 0 || x >= W || y >= H) continue;

      var dx = centers[i].x - centers[j].x, dy = centers[i].y - centers[j].y;
      if (Math.hypot(dx, dy) > d * 1.25) continue;
      var mx = (centers[i].x + centers[j].x) / 2, my = (centers[i].y + centers[j].y) / 2;
      var c = ringColor(img, mx, my, Math.max(1, d * 0.04), 8);

  for (i = 0; i < samples.length; i++) { rs.push(samples[i][0]); gs.push(samples[i][1]); bs.push(samples[i][2]); }

    if (!c) continue;
    nCenter++;
    if (dLab(rgb2lab(c.r, c.g, c.b), sandLab) < 18) sCenter++;
  }
  for (i = 0; i < centers.length; i++) for (j = i + 1; j < centers.length; j++) {
    var dx = centers[i].x - centers[j].x, dy = centers[i].y - centers[j].y;
    if (Math.hypot(dx, dy) > d * 1.25) continue;
    var e = ringColor(img, (centers[i].x + centers[j].x) / 2, (centers[i].y + centers[j].y) / 2,
                      Math.max(1, d * 0.05), 8);
    if (!e) continue;
    nEdge++;
    if (dLab(rgb2lab(e.r, e.g, e.b), sandLab) < 18) sEdge++;

        var sc = gridScore(img, rows, cxT, cyT, dTry, sandLab);

      }

  var tiles = [], i;
  for (i = 0; i < centers.length; i++) {

                 hasToken:false, tokenR:null });

/* عتبة سطوع نسبية: تتكيّف مع الصور المعتمة أو الساطعة جداً */

    catch (e) { continue; }

    if (r.tiles.length !== best.tiles.length) {

      pen += imb * imb * 3;
      for (var j2 = 0; j2 < k; j2++) pen += 2.5 * hist[singles[j2]][pick[singles[j2]]];
      /* لا نكرر تشارك نفس الرقم بين نفس التضاريس في كل الحظوظ */
      for (var u = 0; u < k; u++) for (var v = u + 1; v < k; v++) {
        if (pick[singles[u]] === pick[singles[v]]) {
          pen += 7 * (coinc[ckey(singles[u], singles[v])] || 0);
        }
      }
      pen += rnd() * 0.9;
      if (pen < bestPen) { bestPen = pen; best = pick; }
    }
    for (i = 0; i < doubles.length; i++) {
      id = doubles[i];
      for (var z = 0; z < mult[id]; z++) {
        var ci = z % 2;
        numbersOf[id].push(TIERS[tier].nums[ci]); hist[id][ci]++;
      }
    }
    for (i = 0; i < singles.length; i++) {
      id = singles[i];
      var ci2 = best[id];
      numbersOf[id].push(TIERS[tier].nums[ci2]); hist[id][ci2]++;
    }
    for (var u2 = 0; u2 < singles.length; u2++) for (var v2 = u2 + 1; v2 < singles.length; v2++) {
      if (best[singles[u2]] === best[singles[v2]]) {
        var kk = ckey(singles[u2], singles[v2]);
        coinc[kk] = (coinc[kk] || 0) + 1;
      }
    }
  }

  /* توزيع أرقام كل تضاريس على بلاطاتها بحيث تتباعد الأرقام القوية */
  var adj = buildAdjacency(tiles);
  var assign = new Array(tiles.length).fill(null);
  for (i = 0; i < order.length; i++) {
    id = order[i];
    var nums = numbersOf[id].slice();
    for (var q = nums.length - 1; q > 0; q--) {
      var w = Math.floor(rnd() * (q + 1));
      var tmp0 = nums[q]; nums[q] = nums[w]; nums[w] = tmp0;
    }
    for (var g = 0; g < groups[id].length; g++) assign[groups[id][g]] = nums[g];
  }
  function score() {
    var sc = 0;
    for (var a = 0; a < adj.length; a++) {
      for (var b2 = 0; b2 < adj[a].length; b2++) {
        var bIdx = adj[a][b2];
        if (bIdx < a) continue;
        var n1 = assign[a], n2 = assign[bIdx];
        if (n1 == null || n2 == null) continue;
        var p1 = pipsOf(n1), p2 = pipsOf(n2);
        if (n1 === n2) sc += 9;
        if (p1 === 5 && p2 === 5) sc += 14;
        else if (p1 >= 4 && p2 >= 4) sc += 5;
        sc += p1 * p2 * 0.12;
      }
    }
    return sc;
  }
  var cur = score();
  for (var it = 0; it < 9000; it++) {
    id = order[Math.floor(rnd() * order.length)];
    var gg = groups[id];
    if (gg.length < 2) continue;
    var i1 = Math.floor(rnd() * gg.length), i2 = Math.floor(rnd() * gg.length);
    if (i1 === i2) continue;
    var t1 = gg[i1], t2 = gg[i2];
    if (assign[t1] === assign[t2]) continue;
    var keep = assign[t1];
    assign[t1] = assign[t2]; assign[t2] = keep;
    var s2 = score();
    if (s2 <= cur) { cur = s2; }
    else { assign[t2] = assign[t1]; assign[t1] = keep; }
  }
  return { assign:assign, order:order, groups:groups, numbersOf:numbersOf,
           slotsOf:slotsOf, adjacency:adj, score:cur };
}

/* ---------- التحقق من القوانين ---------- */
function checkRules(res) {
  var rows = [], issues = [], oks = [], i, id;
  for (i = 0; i < res.order.length; i++) {
    id = res.order[i];
    var per = [[], [], [], []];
    var sl = res.slotsOf[id], nums = res.numbersOf[id];
    for (var j = 0; j < sl.length; j++) per[sl[j]].push(nums[j]);
    rows.push({ terrain:id, tiers:per, count:res.groups[id].length });
    for (var t = 0; t < 4; t++) {
      if (per[t].length > 1) {
        issues.push('تضاريس «' + terrainById(id).name + '» أخذت أكثر من رقم من ' + TIERS[t].name +
                    ' لأن عدد بلاطاتها ' + res.groups[id].length + ' (أكثر من ٤).');
      }
    }
  }
  var pairOk = true;
  for (var p = 0; p < PAIRS.length; p++) {
    var A = PAIRS[p][0], B = PAIRS[p][1];
    if (!res.numbersOf[A] || !res.numbersOf[B]) continue;
    for (var tt = 0; tt < 4; tt++) {
      var na = [], nb = [];
      for (var x = 0; x < res.slotsOf[A].length; x++) if (res.slotsOf[A][x] === tt) na.push(res.numbersOf[A][x]);
      for (var y = 0; y < res.slotsOf[B].length; y++) if (res.slotsOf[B][y] === tt) nb.push(res.numbersOf[B][y]);
      for (var z = 0; z < na.length; z++) if (nb.indexOf(na[z]) >= 0) {
        pairOk = false;
        issues.push('تعارض: «' + terrainById(A).name + '» و«' + terrainById(B).name +
                    '» أخذا نفس الرقم ' + na[z] + ' في ' + TIERS[tt].name + '.');
      }
    }
  }
  if (pairOk) oks.push('الشجر ≠ الطوب، والقمح ≠ الحجر في كل الحظوظ.');
  var oneEach = issues.length === 0;
  if (oneEach) oks.push('كل تضاريس أخذت رقماً واحداً فقط من كل حظ.');
  return { rows:rows, issues:issues, oks:oks };
}

return {
  TERRAINS:TERRAINS, TERRAIN_IDS:TERRAIN_IDS, TIERS:TIERS, PAIRS:PAIRS,
  terrainById:terrainById, pipsOf:pipsOf,
  rgb2hsv:rgb2hsv, rgb2lab:rgb2lab, dLab:dLab, terrainDistance:terrainDistance,
  median:median, makeRng:makeRng,
  detectTokens:detectTokens, fitLattice:fitLattice, buildTokenMask:buildTokenMask,
  latticeToPoint:latticeToPoint, pointToLattice:pointToLattice,
  sampleColor:sampleColor, completeBoard:completeBoard, classifyTiles:classifyTiles,
  analyzeImage:analyzeImage, analyzeBest:analyzeBest, MASK_PRESETS:MASK_PRESETS,
  detectByLand:detectByLand, findLandBox:findLandBox, ROW_PATTERNS:ROW_PATTERNS,
  hasNumberAt:hasNumberAt,
  buildAdjacency:buildAdjacency, tierSlots:tierSlots,
  assignNumbers:assignNumbers, checkRules:checkRules
};
})();
if (typeof module !== 'undefined' && module.exports) module.exports = CORE;
/* ==== CORE END ==== */
</script>

<script>
(function () {
'use strict';
var $ = function (id) { return document.getElementById(id); };
var AR = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
function ar(n) { return String(n).split('').map(function (c) {
  return /[0-9]/.test(c) ? AR[+c] : c; }).join(''); }

var S = { img:null, origW:0, origH:0, work:null, mask:null,
          tiles:[], d:0, tokenR:0, theta:0, result:null, assign:null,
          mode:'none', sel:-1, drag:-1, pick:'wood', showNames:true,
          seed:1, viewScale:1, lastFix:null };

function note(kind, html) {
  var n = $('status');

  n.innerHTML = html;
}

/* ---------- شرائح التضاريس ---------- */
(function () {
  var box = $('chips'), html = '';
  CORE.TERRAINS.forEach(function (t) {
    html += '<button type="button" class="chip' + (t.id === S.pick ? ' on' : '') +
            '" id="chip-' + t.id + '" data-t="' + t.id + '">' +
            '<i style="background:' + t.css + '"></i>' + t.name + '</button>';
  });
  box.innerHTML = html;
  box.addEventListener('click', function (e) {
    var el = e.target.closest('.chip'); if (!el) return;
    S.pick = el.getAttribute('data-t');
    Array.prototype.forEach.call(box.children, function (c) { c.classList.remove('on'); });
    el.classList.add('on');
    if (S.sel >= 0 && S.tiles[S.sel]) {
      S.lastFix = { rgb:S.tiles[S.sel].rgb, type:S.pick };
      S.tiles[S.sel].terrain = S.pick;
      S.sel = -1;
      invalidate();
      offerApplyAll();
    }
  });
})();

/* ---------- «طبّق على كل البلاطات بنفس اللون» ---------- */
function similarTiles() {
  if (!S.lastFix || !S.lastFix.rgb) return [];
  var base = CORE.rgb2lab(S.lastFix.rgb[0], S.lastFix.rgb[1], S.lastFix.rgb[2]);
  var out = [];
  for (var i = 0; i < S.tiles.length; i++) {
    var t = S.tiles[i];
    if (!t.rgb || t.terrain === S.lastFix.type) continue;
    if (CORE.dLab(base, CORE.rgb2lab(t.rgb[0], t.rgb[1], t.rgb[2])) < 20) out.push(i);
  }
  return out;
}
function offerApplyAll() {
  var list = similarTiles();
  if (!list.length) { $('applyRow').hidden = true; return; }
  var T = CORE.terrainById(S.lastFix.type);
  $('bApply').textContent = '🔁 طبّق «' + T.name + '» على كل البلاطات بنفس اللون (' + ar(list.length) + ')';
  $('applyRow').hidden = false;
}
$('bApply').addEventListener('click', function () {
  var list = similarTiles();
  list.forEach(function (i) { S.tiles[i].terrain = S.lastFix.type; });
  $('applyRow').hidden = true;
  invalidate();
});

/* ---------- كل بلاطة بلا رقم قديم تُعتبر طوباً ---------- */
/* القرار لا يعتمد على لون البلاطة إطلاقاً، بل على وجود رقم قديم في مركزها،
   لأن اللاعب يستبدل البلاطة الفارغة ببلاطة طوب على الطاولة. */
function applyDesertRule(tiles) {
  var i, n = 0, blanks = [];
  var sc = S.work ? S.work.scale : 1;
  for (i = 0; i < tiles.length; i++) {
    var hasNum = true;
    if (S.work && S.d > 0) {
      try {
        hasNum = CORE.hasNumberAt(S.work, tiles[i].x * sc, tiles[i].y * sc,
                                  S.d * sc, (tiles[i].tokenR || S.tokenR) * sc);
      } catch (e) { hasNum = true; }
    }
    tiles[i].hasNumber = hasNum;
    if (!hasNum) blanks.push(i);
  }
  /* إن بدت بلاطات كثيرة فارغة فالقياس غير موثوق، فنكتفي بتحويل ما صُنّف صحراءَ */
  if (blanks.length >= 1 && blanks.length <= 3) {
    for (i = 0; i < blanks.length; i++) {
      if (tiles[blanks[i]].terrain !== 'brick') n++;
      tiles[blanks[i]].terrain = 'brick';
    }
  }
  for (i = 0; i < tiles.length; i++) {
    if (tiles[i].terrain === 'desert') { tiles[i].terrain = 'brick'; n++; }
  }
  return n;
}

/* ---------- رفع الصورة ---------- */
$('b1').addEventListener('click', function () { $('file').click(); });
$('file').addEventListener('change', function () {
  if (this.files && this.files[0]) loadFile(this.files[0]);
});
window.addEventListener('paste', function (e) {
  var items = (e.clipboardData || {}).items || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') === 0) { loadFile(items[i].getAsFile()); break; }
  }
});
['dragover','drop'].forEach(function (ev) {
  window.addEventListener(ev, function (e) {
    e.preventDefault();
    if (ev === 'drop' && e.dataTransfer.files && e.dataTransfer.files[0]) {
      loadFile(e.dataTransfer.files[0]);
    }
  });
});

function loadFile(file) {
  if (!file || file.type.indexOf('image') !== 0) {
    note('err', 'هذا الملف ليس صورة. اختر صورة PNG أو JPG.');
    return;
  }
  var url = URL.createObjectURL(file), im = new Image();
  im.onload = function () {
    URL.revokeObjectURL(url);
    S.img = im; S.origW = im.naturalWidth; S.origH = im.naturalHeight;
    S.result = null; S.assign = null; S.sel = -1;
    prepareWork();
    detect();
  };
  im.onerror = function () { note('err', 'تعذّر فتح الصورة. جرّب صيغة أخرى.'); };
  im.src = url;
}
function prepareWork() {
  var sc = Math.min(1, 1100 / Math.max(S.origW, S.origH));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(S.origW * sc));
  c.height = Math.max(1, Math.round(S.origH * sc));
  var g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(S.img, 0, 0, c.width, c.height);
  var id = g.getImageData(0, 0, c.width, c.height);
  S.work = { width:id.width, height:id.height, data:id.data, scale:c.width / S.origW };
  S.mask = null;
}
function workMask() {
  if (!S.mask) S.mask = CORE.buildTokenMask(S.work);
  return S.mask;
}

/* ---------- الكشف التلقائي ---------- */
function detect() {
  $('b1').classList.add('busy');
  note('', '⏳ جارٍ قراءة الخريطة...');
  setTimeout(function () {
    var res;
    try { res = CORE.analyzeBest(S.work); }
    catch (err) { res = { ok:false, reason:'error' }; }
    $('b1').classList.remove('busy');
    var sc = S.work.scale;
    $('stage').hidden = false;
    if (res.ok && res.tiles.length >= 5) {
      S.mask = res.mask;
      S.theta = Math.atan2(res.lattice.V1.y, res.lattice.V1.x);
      S.d = res.d / sc;
      S.tokenR = (res.tokenRadius || res.d * 0.24) / sc;
      S.tiles = res.tiles.map(function (t) {
        return { x:t.x / sc, y:t.y / sc, terrain:t.terrain, rgb:t.rgb,
                 hasToken:!!t.hasToken, tokenR:(t.tokenR || res.tokenRadius) / sc };
      });
      S.result = null; S.assign = null; S.sel = -1;
      $('diag').textContent = 'img ' + S.origW + 'x' + S.origH +
        ' | work ' + S.work.width + 'x' + S.work.height +
        ' | method ' + (res.method || 'tokens') +
        ' | tiles ' + res.tiles.length +
        ' | d ' + S.d.toFixed(1) +
        ' | tokenR ' + S.tokenR.toFixed(1) +
        (res.preset ? ' | preset ' + res.preset.map(function(x){return x.toFixed(2);}).join(',') : '') +
        (res.landScore !== undefined ? ' | landScore ' + res.landScore.toFixed(2) : '') +
        (res.lattice && res.lattice.error !== undefined ? ' | err ' + res.lattice.error.toFixed(2) : '');
      var turned = applyDesertRule(S.tiles);
      var extra = turned
        ? ' وحوّلتُ <b>' + ar(turned) + '</b> بلاطة بلا رقم إلى <b>طوب</b> فستأخذ رقماً.'
        : '';
      note('ok', '✅ قرأتُ <b>' + ar(S.tiles.length) + '</b> بلاطة.' + extra +
        '<br>اضغط الزر الأخضر لتوزيع الأرقام.');
      $('applyRow').hidden = true; S.lastFix = null;
    } else {
      S.tiles = []; S.result = null; S.assign = null;
      $('diag').textContent = 'img ' + S.origW + 'x' + S.origH +
        ' | work ' + S.work.width + 'x' + S.work.height +
        ' | FAILED ' + (res.reason || '?');
      note('warn', '⚠️ لم أستطع قراءة الخريطة تلقائياً من هذه الصورة.<br>' +
        'افتح <b>«⚙️ إعدادات متقدمة»</b> بالأسفل ثم اضغط <b>«⚙️ شبكة يدوية»</b> ' +
        'واضبط الحجم والموضع حتى تنطبق الشبكة على الخريطة.');
      $('adv').open = true;
      showManual();
    }
    invalidate();
  }, 30);
}

/* ---------- الرسم ---------- */
var view = $('view'), vctx = view.getContext('2d');
function hexPath(g, x, y, R, th) {
  g.beginPath();
  for (var k = 0; k < 6; k++) {
    var a = th + Math.PI/6 + k * Math.PI/3;
    var px = x + R * Math.cos(a), py = y + R * Math.sin(a);
    if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}
function tokenRadius() {
  var base = (S.tokenR || (S.d * 0.24) || 18) * 1.3;
  if (S.d) base = Math.min(base, S.d * 0.40);
  return base * (+$('tokenSize').value) / 100;
}
function drawToken(g, x, y, r, num, digits) {
  var pips = CORE.pipsOf(num), hot = pips === 5;
  g.save();
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = r * 0.4; g.shadowOffsetY = r * 0.1;
  g.fillStyle = '#F2E6C6'; g.fill();
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.lineWidth = Math.max(1, r * 0.085); g.strokeStyle = '#6E5B38'; g.stroke();
  g.beginPath(); g.arc(x, y, r * 0.84, 0, Math.PI * 2);
  g.lineWidth = Math.max(1, r * 0.05); g.strokeStyle = '#C9B183'; g.stroke();
  g.fillStyle = hot ? '#B3291E' : '#23201B';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + (r * 1.02) + 'px "Arial Black","Segoe UI",Tahoma,sans-serif';
  g.fillText(digits === 'arabic' ? ar(num) : String(num), x, y - r * 0.13);
  var dr = Math.max(0.7, r * 0.06), gap = r * 0.17, sx = x - gap * (pips - 1) / 2;
  for (var i = 0; i < pips; i++) {
    g.beginPath(); g.arc(sx + i * gap, y + r * 0.56, dr, 0, Math.PI * 2);
    g.fillStyle = hot ? '#B3291E' : '#23201B'; g.fill();
  }
  g.restore();
}
function render() {
  if (!S.img) return;
  var sc = Math.min(1, 1400 / S.origW);
  S.viewScale = sc;
  view.width = Math.max(1, Math.round(S.origW * sc));
  view.height = Math.max(1, Math.round(S.origH * sc));
  vctx.clearRect(0, 0, view.width, view.height);
  vctx.drawImage(S.img, 0, 0, view.width, view.height);
  if (S.assign) {
    var R = tokenRadius() * sc, dg = $('digits').value;
    for (var i = 0; i < S.tiles.length; i++) {
      if (S.assign[i] == null) continue;
      drawToken(vctx, S.tiles[i].x * sc, S.tiles[i].y * sc, R, S.assign[i], dg);
    }
  }
  if (!S.showNames) return;
  var HR = (S.d ? S.d / Math.sqrt(3) : 40) * sc;
  for (var j = 0; j < S.tiles.length; j++) {
    var t = S.tiles[j], T = CORE.terrainById(t.terrain) || CORE.TERRAINS[0];
    var x = t.x * sc, y = t.y * sc, isSel = (j === S.sel);
    hexPath(vctx, x, y, HR * 0.94, S.theta);
    vctx.fillStyle = T.css + (isSel ? '88' : '4D');
    vctx.fill();
    vctx.lineWidth = Math.max(2, HR * (isSel ? 0.13 : 0.07));
    vctx.strokeStyle = isSel ? '#E9A700' : T.css;
    vctx.stroke();
    var fs = Math.max(11, HR * 0.3);
    vctx.font = '700 ' + fs + 'px "Segoe UI",Tahoma,sans-serif';
    vctx.textAlign = 'center'; vctx.textBaseline = 'middle';
    vctx.lineWidth = Math.max(2, fs * 0.3); vctx.strokeStyle = 'rgba(0,0,0,0.85)';
    vctx.strokeText(T.name, x, y + HR * 0.62);
    vctx.fillStyle = '#ffffff';
    vctx.fillText(T.name, x, y + HR * 0.62);
  }
}
function renderFull() {
  var c = document.createElement('canvas');
  c.width = S.origW; c.height = S.origH;
  var g = c.getContext('2d');
  g.drawImage(S.img, 0, 0);
  if (S.assign) {
    var R = tokenRadius(), dg = $('digits').value;
    for (var i = 0; i < S.tiles.length; i++) {
      if (S.assign[i] == null) continue;
      drawToken(g, S.tiles[i].x, S.tiles[i].y, R, S.assign[i], dg);
    }
  }
  return c;
}

/* ---------- التفاعل ---------- */
function pos(e) {
  var r = view.getBoundingClientRect();
  return { x:(e.clientX - r.left) * (view.width / r.width) / S.viewScale,
           y:(e.clientY - r.top) * (view.height / r.height) / S.viewScale };
}
function hit(p) {
  var best = -1, bd = (S.d || 60) * 0.58;
  for (var i = 0; i < S.tiles.length; i++) {
    var d = Math.hypot(S.tiles[i].x - p.x, S.tiles[i].y - p.y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
view.addEventListener('mousedown', function (e) {
  if (S.mode !== 'move' || !S.img) return;
  var i = hit(pos(e));
  if (i >= 0) { S.drag = i; S.sel = i; render(); e.preventDefault(); }
});
window.addEventListener('mousemove', function (e) {
  if (S.drag < 0) return;
  var p = pos(e);
  S.tiles[S.drag].x = p.x; S.tiles[S.drag].y = p.y;
  render();
});
window.addEventListener('mouseup', function () {
  if (S.drag >= 0) { S.drag = -1; invalidate(); }
});
view.addEventListener('click', function (e) {
  if (!S.img) return;
  if (S.mode === 'none') return;
  var p = pos(e), i = hit(p);
  if (S.mode === 'fix') {
    S.sel = (i >= 0 && i !== S.sel) ? i : -1;
    if (S.sel >= 0) {
      var T = CORE.terrainById(S.tiles[S.sel].terrain);
      $('fixhint').innerHTML = 'البلاطة المحددة نوعها الآن <b>' + T.name +
        '</b> — اختر النوع الصحيح من الأسفل 👇';
      $('fixhint').className = 'note warn';
    } else resetHint();
    render();
  } else if (S.mode === 'del') {
    if (i < 0) return;
    S.tiles.splice(i, 1); S.sel = -1; invalidate();
  } else if (S.mode === 'add') {
    if (i >= 0) return;
    if (!S.d) S.d = Math.min(S.origW, S.origH) / 5;
    S.tiles.push({ x:p.x, y:p.y, terrain:S.pick, hasToken:false,
                   tokenR:S.tokenR || S.d * 0.24 });
    invalidate();
  }
});
function resetHint() {
  $('fixhint').innerHTML = (S.mode === 'none')
    ? 'اضغط «✏️ تصحيح النوع» بالأسفل، ثم اضغط على البلاطة في الصورة واختر نوعها.'
    : 'اضغط على البلاطة في الصورة ثم اختر نوعها الصحيح.';
  $('fixhint').className = 'note';
}
function invalidate() {
  S.result = null; S.assign = null;
  $('ruleWrap').hidden = true;
  resetHint();
  render(); refresh();
}

/* ---------- الحالة والأزرار ---------- */
function refresh() {
  var has = S.tiles.length > 0, done = !!S.assign;
  $('b2').disabled = !has;
  $('b3').disabled = !done;
  $('bShuffle').disabled = !done;
  $('b1').classList.toggle('on', !has);
  $('b2').classList.toggle('on', has && !done);
  $('b3').classList.toggle('on', done);
  var counts = {};
  S.tiles.forEach(function (t) { counts[t.terrain] = (counts[t.terrain] || 0) + 1; });
  var html = '';
  CORE.TERRAINS.forEach(function (T) {
    var n = counts[T.id] || 0;
    if (!n) return;
    html += '<span class="cnt"><i style="background:' + T.css + '"></i>' +
            T.name + ' <b>' + ar(n) + '</b></span>';
  });
  if (S.tiles.length) html += '<span class="cnt">المجموع <b>' + ar(S.tiles.length) + '</b></span>';
  $('counts').innerHTML = html;
}

/* ---------- التوزيع ---------- */
function assign(fresh) {
  if (!S.tiles.length) return;
  if (fresh) S.seed = Math.floor(Math.random() * 1e9) + 1;
  S.result = CORE.assignNumbers(S.tiles, { dropMode:$('dropMode').value, seed:S.seed });
  S.assign = S.result.assign;
  S.sel = -1;
  var chk = CORE.checkRules(S.result);
  if (chk.issues.length) {
    note('warn', '⚠️ وزّعتُ الأرقام، لكن هناك ملاحظة: ' + chk.issues[0] +
      '<br>افتح الإعدادات المتقدمة لرؤية جدول التحقق كاملاً.');
  } else {
    note('ok', '✅ تم التوزيع بنجاح وكل القوانين محققة. اضغط الزر الأخضر لتنزيل الصورة.');
  }
  buildRuleTable(chk);
  render(); refresh();
}
function buildRuleTable(chk) {
  var html = '<tr><th>التضاريس</th>';
  CORE.TIERS.forEach(function (T) {
    html += '<th>' + T.name + '<br><small>' + T.nums[0] + ' أو ' + T.nums[1] + '</small></th>';
  });
  html += '</tr>';
  chk.rows.forEach(function (row) {
    var T = CORE.terrainById(row.terrain);
    html += '<tr><td class="nm"><i style="display:inline-block;width:11px;height:11px;' +
            'border-radius:3px;background:' + T.css + ';margin-left:5px"></i>' + T.name + '</td>';
    for (var t = 0; t < 4; t++) {
      var v = row.tiers[t];
      html += '<td>' + (v.length ? v.map(function (x) {
        return '<span class="num' + (CORE.pipsOf(x) === 5 ? ' hot' : '') + '">' + x + '</span>';
      }).join('') : '—') + '</td>';
    }
    html += '</tr>';
  });
  $('ruleTable').innerHTML = html;
  var m = '';
  chk.oks.forEach(function (o) { m += '<div class="note ok">✅ ' + o + '</div>'; });
  chk.issues.forEach(function (o) { m += '<div class="note warn">⚠️ ' + o + '</div>'; });
  $('ruleMsg').innerHTML = m;
  $('ruleWrap').hidden = false;
}
$('b2').addEventListener('click', function () { assign(false); });
$('bShuffle').addEventListener('click', function () { assign(true); });
$('bEye').addEventListener('click', function () {
  S.showNames = !S.showNames;
  $('bEye').textContent = S.showNames ? '👁️ إخفاء الأسماء' : '👁️ إظهار الأسماء';
  render();
});

/* ---------- التنزيل ---------- */
function saveViaLink(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function saveBlob(blob, name) {
  var host = (typeof window !== 'undefined') ? window.claude : null;
  if (host && typeof host.use === 'function') {
    host.use('downloads').then(function (dl) {
      if (!dl) { saveViaLink(blob, name); return; }
      dl.save({ filename:name, data:blob }).then(function () {
        note('ok', '✅ تم حفظ الصورة.');
      }, function (err) {
        if (err && err.code === 'declined') note('', 'أُلغي الحفظ. اضغط الزر مرة أخرى متى شئت.');
        else saveViaLink(blob, name);
      });
    }, function () { saveViaLink(blob, name); });
    return;
  }
  saveViaLink(blob, name);
}
$('b3').addEventListener('click', function () {
  if (!S.img || !S.assign) return;
  note('', '⏳ جارٍ تجهيز الصورة بدقتها الأصلية...');
  renderFull().toBlob(function (blob) {
    if (!blob) { note('err', 'تعذّر تجهيز الصورة. جرّب مرة أخرى.'); return; }
    saveBlob(blob, 'catan-numbers.png');
  }, 'image/png');
});

/* ---------- الإعدادات المتقدمة ---------- */
$('digits').addEventListener('change', render);
$('tokenSize').addEventListener('input', function () {
  $('szV').textContent = ar(this.value) + '٪'; render();
});
$('dropMode').addEventListener('change', function () { if (S.assign) assign(false); });
[['mFix','fix'],['mAdd','add'],['mDel','del'],['mMove','move']].forEach(function (pair) {
  $(pair[0]).addEventListener('click', function () {
    S.mode = pair[1]; S.sel = -1;
    var names = { fix:'اضغط على بلاطة لتصحيح نوعها.', add:'اضغط على مكان فارغ لإضافة بلاطة بالنوع المحدد.',
                  del:'اضغط على بلاطة لحذفها.', move:'اسحب بلاطة لتصحيح موضعها.' };
    $('fixhint').innerHTML = names[S.mode];
    $('fixhint').className = 'note';
    render();
  });
});
$('bRedetect').addEventListener('click', function () { if (S.work) detect(); });
$('bClear').addEventListener('click', function () {
  S.tiles = []; S.sel = -1; invalidate();
});
$('bManual').addEventListener('click', function () { showManual(); genManual(); });
function showManual() { $('manual').hidden = false; }
['mSize','mX','mY','mR'].forEach(function (id) {
  $(id).addEventListener('input', genManual);
});
$('mRows').addEventListener('change', genManual);
function genManual() {
  if (!S.img) return;
  var rows = ($('mRows').value || '').split(/[^0-9]+/)
    .map(function (x) { return parseInt(x, 10); })
    .filter(function (x) { return x > 0 && x < 40; });
  if (!rows.length) rows = [3,4,5,4,3];
  var size = +$('mSize').value, oX = +$('mX').value, oY = +$('mY').value, rot = +$('mR').value;
  $('mSizeV').textContent = ar(size) + '٪';
  $('mXV').textContent = ar(oX); $('mYV').textContent = ar(oY);
  $('mRV').textContent = ar(rot) + '°';
  var maxc = Math.max.apply(null, rows);
  var hFac = ((rows.length - 1) * 1.5 + 2) / Math.sqrt(3);
  var dAuto = Math.min(S.origW * 0.94 / maxc, S.origH * 0.94 / hFac);
  var d = dAuto * size / 100, R = d / Math.sqrt(3);
  var th = rot * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
  var cx = S.origW / 2 + oX / 100 * S.origW, cy = S.origH / 2 + oY / 100 * S.origH;
  var tiles = [];
  rows.forEach(function (cnt, r) {
    for (var i = 0; i < cnt; i++) {
      var bx = (i - (cnt - 1) / 2) * d, by = (r - (rows.length - 1) / 2) * 1.5 * R;
      tiles.push({ x:cx + bx*cs - by*sn, y:cy + bx*sn + by*cs, hasToken:false, tokenR:d * 0.24 });
    }
  });
  S.d = d; S.theta = th;
  if (!S.tokenR) S.tokenR = d * 0.24;
  var sc = S.work.scale;
  var tmp = tiles.map(function (t) {
    return { x:t.x * sc, y:t.y * sc, hasToken:false, tokenR:d * 0.24 * sc };
  });
  CORE.classifyTiles(S.work, tmp, d * sc, workMask(), d * 0.24 * sc);
  tiles.forEach(function (t, i) {
    t.terrain = tmp[i].terrain || 'desert';
    t.rgb = tmp[i].rgb;
  });
  applyDesertRule(tiles);
  S.tiles = tiles; S.sel = -1;
  $('stage').hidden = false;
  invalidate();
}

refresh();
})();
</script>
